name: Assemble

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [project-updated]

permissions:
  contents: write

concurrency:
  group: assemble
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Assemble
        run: node scripts/assemble.mjs out
      - name: Push the deploy branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          message="deploy: $(jq -r 'to_entries | map((.key | split("/") | last) + "@" + .value[0:7]) | join(" ")' out/.lab-sources.json)"
          cd out
          git init -q -b deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "$message"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" deploy
